# Local development environment only. This is not a production topology.
name: stewardarc

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      # Local development placeholders, not secrets. Must match backend/.env.
      POSTGRES_DB: stewardarc
      POSTGRES_USER: stewardarc
      POSTGRES_PASSWORD: stewardarc
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stewardarc -d stewardarc"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
    volumes:
      - ./backend:/app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24.21.0-trixie-slim
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      npm_config_update_notifier: "false"
    volumes:
      - ./frontend:/app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"

volumes:
  postgres-data:
